{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}

<div class="form-card">
    <h1>Entrar</h1>

    {% if form.errors %}
        <div class="alert alert-error">
            Usuário ou senha inválidos.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Usuário</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Senha</label>
            {{ form.password }}
        </div>

        <div class="actions">
            <button type="submit" class="btn-primary">Entrar</button>
            <a href="{% url 'cadastro' %}" class="btn-secondary">Criar conta</a>
        </div>
    </form>
</div>

{% endblock %}
